<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#44281a">
    <title>Sin conexión · Cabaña Fresh Maní</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #5a3624, #1c1210);
            color: #f5e6c8;
        }
        .card {
            max-width: 24rem;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(4px);
        }
        img { width: 140px; height: auto; margin-bottom: 1.5rem; opacity: 0.95; }
        h1 { font-size: 1.25rem; color: #fff; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; line-height: 1.5; color: #d9c6a3; margin-bottom: 1.5rem; }
        button {
            appearance: none;
            border: 0;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #f08a24, #c85a0a);
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            box-shadow: 0 10px 25px -8px rgba(200, 90, 10, 0.6);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/cabana-fresh-mani-logo.png" alt="Cabaña Fresh Maní">
        <h1>Estás sin conexión</h1>
        <p>No se pudo cargar esta página. Revisa tu conexión a internet e inténtalo de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
